[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:filesystem]
command=node /app/mcp_http_bridge.js 4040 mcp-server-filesystem /
priority=5
autorestart=true
startsecs=3

[program:shell]
command=node /app/mcp_http_bridge.js 4041 /opt/shellvenv/bin/python /opt/shell_launcher.py / --shell bash /bin/bash
priority=5
autorestart=true
startsecs=3

[program:python]
command=node /app/mcp_http_bridge.js 4042 /opt/pyvenv/bin/mcp-python-interpreter --dir / --python-path /usr/local/bin/python3
priority=5
autorestart=true
startsecs=4

[program:genoffice]
command=node /app/mcp_http_bridge.js 4043 node /opt/mcp-genoffice/bin/mcp-genoffice.mjs
priority=5
autorestart=true
startsecs=6

[program:read-write-stack]
command=python3 /opt/wait_stack.py
priority=10
autorestart=true
