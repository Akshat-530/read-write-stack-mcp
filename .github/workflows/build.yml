name: build
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  public-package:
    # Keep the published GHCR image anonymously pullable (no `docker login`).
    # NOTE: package visibility can only be changed with a CLASSIC PAT that has
    # `write:packages` — fine-grained PATs and the Actions GITHUB_TOKEN are
    # refused by the Packages API. Add a classic PAT as the PACKAGES_TOKEN repo
    # secret to enable this; otherwise the step is skipped and visibility is
    # left as-is.
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure GHCR package visibility is public
        continue-on-error: true
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "PACKAGES_TOKEN not set (needs a classic PAT with write:packages) - skipping."
            exit 0
          fi
          GH_TOKEN="$PACKAGES_TOKEN" gh api --method PATCH "/user/packages/container/${GITHUB_REPOSITORY#*/}" -f visibility=public
